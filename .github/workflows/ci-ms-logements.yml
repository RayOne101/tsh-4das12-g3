name: CI MS-Logements

on:
  push:
    paths:
      - 'Backend/ms-logements/**'
      - '.github/workflows/ci-ms-logements.yml'
    branches: [ develop, main ]
  pull_request:
    paths:
      - 'Backend/ms-logements/**'
    branches: [ develop, main ]

jobs:
  build-and-test:
    name: Build & Test ms-logements
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: |
          if [ -f Backend/ms-logements/pom.xml ]; then
            cd Backend/ms-logements
            mvn clean test package -DskipTests=false
          else
            echo "Skeleton mode: pom.xml will be added in S1"
          fi

      - name: Build Docker Image
        run: |
          if [ -f Backend/ms-logements/Dockerfile ]; then
            cd Backend/ms-logements
            docker build -t tsh/ .
          else
            echo "Skeleton mode: Dockerfile will be added in S1"
          fi
