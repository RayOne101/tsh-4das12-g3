server.port=${GATEWAY_PORT:8083}
spring.application.name=gateway

# -------------------------------------------------------------
# EUREKA DISCOVERY
# -------------------------------------------------------------
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# -------------------------------------------------------------
# CORS : le frontend React tourne sur http://localhost:5173
# -------------------------------------------------------------
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origin-patterns=http://localhost:5173
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].max-age=3600
# Evite les doublons si un service aval ajoute aussi les en-tetes CORS.
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
