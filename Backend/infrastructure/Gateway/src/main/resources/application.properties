server.port=${GATEWAY_PORT:8083}
spring.application.name=gateway

# -------------------------------------------------------------
# EUREKA DISCOVERY
# -------------------------------------------------------------
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# CORS & Security Headers
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
spring.cloud.gateway.default-filters[1]=SetResponseHeader=X-Content-Type-Options, nosniff
spring.cloud.gateway.default-filters[2]=SetResponseHeader=X-Frame-Options, DENY
spring.cloud.gateway.default-filters[3]=SetResponseHeader=X-XSS-Protection, 1; mode=block

# -------------------------------------------------------------
# ACTUATOR (Santé et état des microservices)
# -------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# -------------------------------------------------------------
# ZIPKIN TRACING
# -------------------------------------------------------------
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# -------------------------------------------------------------
# SWAGGER / OPENAPI AGGRÉGATEUR (Portail central Swagger)
# -------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=1. Service Utilisateur (User)
springdoc.swagger-ui.urls[0].url=/v3/api-docs/user
springdoc.swagger-ui.urls[1].name=2. Service Logements (Housing)
springdoc.swagger-ui.urls[1].url=/v3/api-docs/housing
springdoc.swagger-ui.urls[2].name=3. Service Colocation
springdoc.swagger-ui.urls[2].url=/v3/api-docs/colocation
springdoc.swagger-ui.urls[3].name=4. Service Contrats (Contract)
springdoc.swagger-ui.urls[3].url=/v3/api-docs/contract
springdoc.swagger-ui.urls[4].name=5. Service Communication (Chat)
springdoc.swagger-ui.urls[4].url=/v3/api-docs/communication
springdoc.swagger-ui.urls[5].name=6. Service Avis (Review)
springdoc.swagger-ui.urls[5].url=/v3/api-docs/review
springdoc.swagger-ui.urls[6].name=7. Service Meubles (Marketplace)
springdoc.swagger-ui.urls[6].url=/v3/api-docs/marketplace
springdoc.swagger-ui.urls[7].name=8. Service Transport
springdoc.swagger-ui.urls[7].url=/v3/api-docs/transport
