server.port=8083
spring.application.name=gateway

# -------------------------------------------------------------
# 1. EUREKA DISCOVERY
# -------------------------------------------------------------
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# -------------------------------------------------------------
# 2. SPRING CLOUD GATEWAY ROUTING RULES
# -------------------------------------------------------------
# Route 1: Route /api/utilisateurs/** to the "USER" microservice discovered by Eureka (lb://USER)
spring.cloud.gateway.routes[0].id=user-service-route
spring.cloud.gateway.routes[0].uri=lb://USER
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/utilisateurs/**

