global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Microservice User (port 8762 en local, 8763 selon application.properties)
  - job_name: 'user-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8762']
        labels:
          service: 'user'
          environment: 'dev'

  # Gateway (port 8083)
  - job_name: 'gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8083']
        labels:
          service: 'gateway'
          environment: 'dev'

  # Eureka (port 8761)
  - job_name: 'eureka'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8761']
        labels:
          service: 'eureka'
