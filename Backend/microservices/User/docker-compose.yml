services:
  postgres-user:
    image: postgres:16-alpine
    container_name: tsh-postgres-user
    restart: always
    environment:
      POSTGRES_DB: tsh_users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_user_data:/var/lib/postgresql/data

  redis-user:
    image: redis:7-alpine
    container_name: tsh-redis-user
    restart: always
    ports:
      - "6379:6379"

  pgweb:
    image: sosedoff/pgweb:latest
    container_name: tsh-pgweb
    restart: always
    ports:
      - "8082:8081"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres-user:5432/tsh_users?sslmode=disable
    command: ["pgweb", "--bind=0.0.0.0", "--listen=8081"]
    depends_on:
      - postgres-user

volumes:
  postgres_user_data:
