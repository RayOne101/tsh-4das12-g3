spring.application.name=User
server.port=8762

# -------------------------------------------------------------
# 1. BASE DE DONNÉES (PostgreSQL)
# -------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/tsh_users}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
# Dev : update + logs SQL. Envoyer JPA_DDL_AUTO=validate / JPA_SHOW_SQL=false hors developpement.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# -------------------------------------------------------------
# 2. SERVICE DISCOVERY (Eureka Server)
# -------------------------------------------------------------
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# -------------------------------------------------------------
# 3. KEYCLOAK (OAuth2 / OIDC)
# -------------------------------------------------------------
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8085/realms/tsh}

# -------------------------------------------------------------
# 4. STOCKAGE DES IMAGES (MinIO)
# -------------------------------------------------------------
minio.url=${MINIO_URL:http://localhost:9000}
minio.public-url=${MINIO_PUBLIC_URL:http://localhost:9000}
minio.access-key=${MINIO_ROOT_USER:minioadmin}
minio.secret-key=${MINIO_ROOT_PASSWORD:minioadmin}
minio.bucket=${MINIO_BUCKET:tsh-avatars}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# -------------------------------------------------------------
# 5. OPENAPI / SWAGGER
# -------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
