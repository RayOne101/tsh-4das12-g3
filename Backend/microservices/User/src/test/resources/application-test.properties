# Profil de test isole : H2 en memoire, Eureka desactive, Keycloak Admin mocke.
spring.datasource.url=jdbc:h2:mem:tsh_users_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

eureka.client.enabled=false
spring.cloud.discovery.enabled=false

keycloak.admin.base-url=http://localhost:9999
keycloak.admin.realm=tsh
keycloak.admin.client-id=test-client
keycloak.admin.client-secret=test-secret
